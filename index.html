<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Math Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 20px;
    }

    .calculator-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .grid-operators {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 24px 0;
    }

    button {
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      color: white;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-add { background-color: #2563eb; }
    .btn-add:hover { background-color: #1d4ed8; }

    .btn-sub { background-color: #dc2626; }
    .btn-sub:hover { background-color: #b91c1c; }

    .btn-mul { background-color: #d97706; }
    .btn-mul:hover { background-color: #b45309; }

    .btn-div { background-color: #059669; }
    .btn-div:hover { background-color: #047857; }

    .result-card {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .result-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: #64748b;
    }

    .result-value {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 4px;
      word-break: break-word;
    }

    .error-text {
      color: #dc2626 !important;
      font-size: 1.1rem !important;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <h1>Math Studio</h1>
      <p>Select an operation to calculate</p>
    </div>

    <div class="input-group">
      <label for="num1">First Number</label>
      <input type="number" id="num1" placeholder="0" step="any">
    </div>

    <div class="input-group">
      <label for="num2">Second Number</label>
      <input type="number" id="num2" placeholder="0" step="any">
    </div>

    <div class="grid-operators">
      <button class="btn-add" onclick="calculate('+')"><span>+</span> Add</button>
      <button class="btn-sub" onclick="calculate('-')"><span>−</span> Subtract</button>
      <button class="btn-mul" onclick="calculate('*')"><span>×</span> Multiply</button>
      <button class="btn-div" onclick="calculate('/')"><span>÷</span> Divide</button>
    </div>

    <div class="result-card">
      <div class="result-label">Output</div>
      <div class="result-value" id="result">0</div>
    </div>
  </div>

  <script>
    function calculate(op) {
      const v1 = parseFloat(document.getElementById('num1').value);
      const v2 = parseFloat(document.getElementById('num2').value);
      const resEl = document.getElementById('result');

      resEl.classList.remove('error-text');

      if (isNaN(v1) || isNaN(v2)) {
        resEl.textContent = 'Enter both numbers';
        resEl.classList.add('error-text');
        return;
      }

      let res;
      switch (op) {
        case '+': res = v1 + v2; break;
        case '-': res = v1 - v2; break;
        case '*': res = v1 * v2; break;
        case '/':
          if (v2 === 0) {
            resEl.textContent = 'Cannot divide by 0';
            resEl.classList.add('error-text');
            return;
          }
          res = v1 / v2;
          break;
      }

      // Round long decimal floats cleanly to 4 places maximum
      resEl.textContent = Number.isInteger(res) ? res : Number(res.toFixed(4));
    }
  </script>

</body>
</html>
