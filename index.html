<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Math Operations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #111827;
      text-align: center;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      min-height: 48px;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-add {
      background-color: #2563eb;
      color: white;
    }
    .btn-add:hover {
      background-color: #1d4ed8;
    }
    .btn-sub {
      background-color: #dc2626;
      color: white;
    }
    .btn-sub:hover {
      background-color: #b91c1c;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      background-color: #f3f4f6;
      border-radius: 8px;
      text-align: center;
    }
    .result-title {
      font-size: 0.875rem;
      color: #6b7280;
    }
    .result-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Math Calculator</h1>
    <div class="input-group">
      <label for="num1">First Number</label>
      <input type="number" id="num1" placeholder="Enter first number">
    </div>
    <div class="input-group">
      <label for="num2">Second Number</label>
      <input type="number" id="num2" placeholder="Enter second number">
    </div>
    <div class="btn-group">
      <button class="btn-add" onclick="calculate('+')">Add (+)</button>
      <button class="btn-sub" onclick="calculate('-')">Subtract (-)</button>
    </div>
    <div class="result-box">
      <div class="result-title">Result</div>
      <div class="result-value" id="result">0</div>
    </div>
  </div>

  <script>
    function calculate(operation) {
      const val1 = parseFloat(document.getElementById('num1').value);
      const val2 = parseFloat(document.getElementById('num2').value);
      const resultEl = document.getElementById('result');

      if (isNaN(val1) || isNaN(val2)) {
        resultEl.textContent = 'Please enter valid numbers';
        resultEl.style.fontSize = '1rem';
        return;
      }

      resultEl.style.fontSize = '1.75rem';
      if (operation === '+') {
        resultEl.textContent = val1 + val2;
      } else if (operation === '-') {
        resultEl.textContent = val1 - val2;
      }
    }
  </script>
</body>
</html>
