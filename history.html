<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Studio - Calculation History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); display: flex; justify-content: center; align-items: center; min-height: 100dvh; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 32px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; color: #0f172a; }
    .nav-link { display: inline-block; margin-top: 8px; color: #2563eb; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
    .history-list { list-style: none; max-height: 320px; overflow-y: auto; margin: 20px 0; padding-right: 4px; }
    .history-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .history-text { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
    .history-time { font-size: 0.75rem; color: #94a3b8; }
    .empty-msg { text-align: center; color: #64748b; padding: 20px 0; font-size: 0.95rem; }
    .btn-clear { width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-clear:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Calculation Log</h1>
      <a href="index.html" class="nav-link">← Back to Calculator</a>
    </div>

    <ul class="history-list" id="historyList"></ul>

    <button class="btn-clear" onclick="clearHistory()">Clear History</button>
  </div>

  <script>
    function renderHistory() {
      const listEl = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('math_history') || '[]');

      if (history.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">No calculations logged yet.</div>';
        return;
      }

      listEl.innerHTML = history.map(item => `
        <li class="history-item">
          <span class="history-text">${item.entry}</span>
          <span class="history-time">${item.timestamp}</span>
        </li>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('math_history');
      renderHistory();
    }

    renderHistory();
  </script>
</body>
</html>
